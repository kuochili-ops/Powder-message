<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>粒子字體特效 - 字元外圍量子發光版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505; /* 略微調暗底色，讓發光更明顯 */
            font-family: "Helvetica Neue", Helvetica, Arial, "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        
        /* 📱 UI 控制面板 */
        .control-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 15, 15, 0.94);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 16px;
            border-radius: 16px;
            color: #fff;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 94%;
            max-width: 500px;
            box-shadow: 0 20px 45px rgba(0,0,0,0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 10;
        }
        
        .row {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .row label {
            white-space: nowrap;
            color: #ccc;
            min-width: 55px;
            font-weight: 500;
        }
        
        .textarea-container {
            flex: 1;
            display: flex;
        }
        textarea {
            flex: 1;
            height: 70px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 8px;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
            resize: none;
            line-height: 1.4;
        }

        .settings-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            width: 100%;
        }
        
        .setting-item {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            min-width: 110px;
        }
        
        .setting-item.color-item {
            flex: 0 0 auto;
            min-width: auto;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #fff;
            cursor: pointer;
            user-select: none;
            font-size: 12px;
            white-space: nowrap;
        }
        .checkbox-label input {
            cursor: pointer;
            width: 15px;
            height: 15px;
        }

        select, input[type="number"] {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 6px 8px;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
            height: 32px;
        }
        
        .color-picker-wrapper {
            position: relative;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.6);
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }
        input[type="color"] {
            position: absolute;
            top: -5px; left: -5px;
            width: 44px; height: 44px;
            padding: 0; margin: 0;
            border: none;
            cursor: pointer;
            background: none;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 2px;
        }
        .btn {
            flex: 1;
            height: 38px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .btn-primary { background: #ffffff; color: #000; }
        .btn-primary:hover { background: #e0e0e0; }
        .btn-secondary { background: rgba(255, 255, 255, 0.12); color: #fff; }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.22); }
        
        #recordBtn { background: #ff3b30; color: white; }
        #recordBtn:hover { background: #ff4f44; }
        .recording { animation: pulse 1s infinite; background: #900 !important; }
        @keyframes pulse { 0% {opacity:1} 50% {opacity:0.6} 100% {opacity:1} }

        /* 📥 全域彈出視窗 */
        .overlay {
            display: none;
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal {
            background: #1c1c1e;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            width: 100%;
            max-width: 340px;
            border: 1px solid #3a3a3c;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            color: white;
        }
        .modal h2 { margin: 0 0 10px 0; color: #007AFF; font-size: 18px; }
        .modal h2.success { color: #34c759; }
        .modal p { color: #aaa; font-size: 13px; margin-bottom: 15px; line-height: 1.4; }
        .modal-btn {
            width: 100%; height: 45px; background: #007AFF; color: white;
            border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px;
        }
        .modal-btn.success { background: #34c759; }
        
        #shareUrlDisplay {
            width: 100%;
            padding: 10px;
            background: #2c2c2e;
            border: 1px solid #48484a;
            border-radius: 8px;
            color: #fff;
            font-size: 12px;
            margin-bottom: 5px;
            outline: none;
        }

        .tip {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
            letter-spacing: 1px;
            pointer-events: none;
            user-select: none;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div class="tip" id="mainTip">觸碰畫面粉末飛散 / 點擊下方面板設定</div>
    
    <div id="download-overlay" class="overlay">
        <div class="modal">
            <h2 class="success">✨ 錄製完成</h2>
            <p>如果您的瀏覽器沒有自動觸發下載，請點擊下方按鈕手動儲存影片。</p>
            <button id="manualDownloadBtn" class="modal-btn success">下載特效影片</button>
            <button onclick="closeModal('download-overlay')" style="background:none; color:#666; border:none; cursor:pointer; font-size:13px; margin-top:12px;">關閉視窗</button>
        </div>
    </div>

    <div id="link-overlay" class="overlay">
        <div class="modal">
            <h2>🔗 分享網址生成成功</h2>
            <p>網址已支援全平台防亂碼。若沒有自動複製成功，請點擊欄位全選並複製：</p>
            <input type="text" id="shareUrlDisplay" readonly onclick="this.select();">
            <button onclick="closeModal('link-overlay')" class="modal-btn">確定並返回</button>
        </div>
    </div>

    <div class="control-panel" id="uiPanel">
        <div class="row">
            <label>文字輸入</label>
            <div class="textarea-container">
                <textarea id="textInput" placeholder="每行一列文字..."></textarea>
            </div>
        </div>
        
        <div class="settings-grid">
            <div class="setting-item" style="max-width: 90px;">
                <label style="min-width: auto;">秒數</label>
                <input type="number" id="durationInput" value="4" min="2" max="20">
            </div>

            <div class="setting-item" style="max-width: 120px;">
                <label class="checkbox-label">
                    <input type="checkbox" id="includeTimeCheck"> 加上時間
                </label>
            </div>
            
            <div class="setting-item">
                <label style="min-width: auto;">字型</label>
                <select id="fontSelect">
                    <option value='"Helvetica Neue", Helvetica, Arial, "PingFang TC", "Heiti TC", "微軟正黑體", sans-serif'>經典粗黑體 (預設)</option>
                    <option value='"DFKai-SB", "BiauKai", "PMingLiU", "新細明體", serif'>傳統標楷/明體 (細)</option>
                    <option value='"Times New Roman", "Georgia", serif'>英數襯線體 (古典)</option>
                </select>
            </div>
            
            <div class="setting-item color-item">
                <label style="min-width: auto;">顏色</label>
                <div class="color-picker-wrapper" id="colorPickerWrapper">
                    <input type="color" id="colorPicker" value="#ffffff">
                </div>
            </div>
        </div>
        
        <div class="btn-group">
            <button class="btn btn-secondary" id="applyBtn">更新重播</button>
            <button class="btn" id="recordBtn">🔴 錄製製作</button>
            <button class="btn btn-primary" id="sendBtn">🔗 傳送網址</button>
        </div>
    </div>

    <canvas id="particleCanvas"></canvas>

    <script>
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        let textLines = ["微風拂過", "細粉飛散", "凝聚成字"];
        let includeTime = false; 
        
        let currentLineIndex = 0;
        let lineDuration = 4000; 
        let currentFont = '"Helvetica Neue", Helvetica, Arial, "PingFang TC", "Heiti TC", "微軟正黑體", sans-serif';
        let baseColor = "#ffffff";

        let particles = [];
        let stateTimer = 0;      
        let phase = "turbulent"; 
        let globalTimer = null;  

        let mediaRecorder, recordedChunks = [], isRecording = false;

        const particleSpacing = 3; 
        const particleRadius = 1.1; 
        const friction = 0.93;     

        function getFreshDateTimeString() {
            const now = new Date();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const date = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            return `${month}/${date} ${hours}:${minutes}`;
        }

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 255, g: 255, b: 255 };
        }

        class Particle {
            constructor(x, y, isGlowParticle = false) {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.targetX = x;
                this.targetY = y;
                this.vx = (Math.random() - 0.5) * 5;
                this.vy = (Math.random() - 0.5) * 5;
                this.noiseSeedX = Math.random() * 100;
                this.noiseSeedY = Math.random() * 100;
                this.noiseSpeed = Math.random() * 4 + 2;
                this.isGlow = isGlowParticle; // 🌟 標記是否為外圍發光微粒
                this.assignColor();
            }

            assignColor() {
                const rgb = hexToRgb(baseColor);
                const colorVary = Math.floor(Math.random() * 40) - 20; 
                const r = Math.max(0, Math.min(255, rgb.r + colorVary));
                const g = Math.max(0, Math.min(255, rgb.g + colorVary));
                const b = Math.max(0, Math.min(255, rgb.b + colorVary));
                
                if (this.isGlow) {
                    // 🌟 發光粒子：透明度較低、帶點靈動的亮感
                    this.color = `rgba(${r}, ${g}, ${b}, ${Math.random() * 0.3 + 0.15})`;
                    this.radius = particleRadius * (Math.random() * 0.8 + 0.5); // 顆粒略小，營造星芒感
                } else {
                    this.color = `rgba(${r}, ${g}, ${b}, ${Math.random() * 0.7 + 0.4})`;
                    this.radius = particleRadius;
                }
            }

            update(deltaTime) {
                if (phase === "turbulent") {
                    this.noiseSeedX += 0.05;
                    this.noiseSeedY += 0.05;
                    let noiseX = Math.sin(this.noiseSeedX + this.y * 0.01) * this.noiseSpeed;
                    let noiseY = Math.cos(this.noiseSeedY + this.x * 0.01) * this.noiseSpeed;
                    this.vx += noiseX * 0.25; 
                    this.vy += noiseY * 0.25;
                    this.vx += (this.targetX - this.x) * 0.003; 
                    this.vy += (this.targetY - this.y) * 0.003;
                    this.vx *= 0.88;
                    this.vy *= 0.88;
                } else if (phase === "gather") {
                    let dx = this.targetX - this.x;
                    let dy = this.targetY - this.y;
                    
                    // 🌟 核心修改：如果是外圍發光粒子，讓它在聚集階段往外產生微幅的圓周/放射飄移
                    if (this.isGlow) {
                        this.vx += dx * 0.04 + (Math.random() - 0.5) * 0.6;
                        this.vy += dy * 0.04 + (Math.random() - 0.5) * 0.6;
                    } else {
                        this.vx += dx * 0.07;
                        this.vy += dy * 0.07;
                    }
                    this.vx *= 0.68;
                    this.vy *= 0.68;
                } else if (phase === "exploded") {
                    this.vx *= friction;
                    this.vy *= friction;
                }

                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
            }

            explode() {
                const angle = Math.random() * Math.PI * 2;
                // 發光粒子爆開時飛得更遠、更有層次
                const speed = this.isGlow ? (Math.random() * 22 + 8) : (Math.random() * 18 + 6);
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
            }
        }

        function loadTextLine(rawText) {
            phase = "turbulent";
            stateTimer = 0;

            const text = String(rawText || "").trim();

            if (text === "") {
                particles.forEach(p => {
                    p.targetX = Math.random() * width;
                    p.targetY = Math.random() * height;
                });
                return;
            }

            const memCanvas = document.createElement('canvas');
            const memCtx = memCanvas.getContext('2d');
            memCanvas.width = width;
            memCanvas.height = height;
            
            memCtx.font = "10px sans-serif"; 
            memCtx.clearRect(0, 0, width, height);

            const isHeiti = currentFont.includes('PingFang') || currentFont.includes('Heiti') || currentFont.includes('Helvetica');
            const fontWeight = isHeiti ? '900' : 'normal';
            
            let fontSize = 40;
            const isTimeFormat = /^[\d/:\s]+$/.test(text);

            if (isTimeFormat) {
                fontSize = Math.min(width * 0.11, height * 0.10);
            } else {
                memCtx.font = `${fontWeight} 50px ${currentFont}`;
                let metrics = memCtx.measureText(text);
                let measuredWidth = metrics.width || (width * 0.5);
                if (measuredWidth < 5) measuredWidth = 5;
                fontSize = ((width * 0.82) / measuredWidth) * 50;
            }
            
            const absoluteMaxFontSize = height * 0.14;
            if (fontSize > absoluteMaxFontSize || isNaN(fontSize) || !isFinite(fontSize)) {
                fontSize = absoluteMaxFontSize;
            }
            if (fontSize < 16) fontSize = 16; 

            memCtx.font = `${fontWeight} ${fontSize}px ${currentFont}`;
            memCtx.fillStyle = "#ffffff";
            memCtx.textAlign = "center";
            memCtx.textBaseline = "middle";
            memCtx.fillText(text, width / 2, height / 2);

            const imgData = memCtx.getImageData(0, 0, width, height).data;
            let newTargets = [];

            // 🌟 物理算法升級：掃描邊緣並生成向外發光的擴散座標點
            for (let y = 0; y < height; y += particleSpacing) {
                for (let x = 0; x < width; x += particleSpacing) {
                    const idx = (y * width + x) * 4;
                    if (imgData[idx + 3] > 128 && imgData[idx] > 128) {
                        
                        // 1. 骨架實心粒子
                        newTargets.push({ x: x, y: y, isGlow: false });

                        // 2. 邊緣偵測：如果四周有空白，代表這是邊緣！向外散射發光粒子
                        const leftIdx = idx - 4;
                        const rightIdx = idx + 4;
                        const topIdx = idx - (width * 4);
                        const bottomIdx = idx + (width * 4);

                        if (imgData[leftIdx + 3] < 50 || imgData[rightIdx + 3] < 50 || imgData[topIdx + 3] < 50 || imgData[bottomIdx + 3] < 50) {
                            // 往字元外圍隨機放射 1~2 個帶有位移的外圍發光點
                            const glowCount = Math.random() > 0.4 ? 2 : 1;
                            for (let g = 0; g < glowCount; g++) {
                                const angle = Math.random() * Math.PI * 2;
                                const distance = Math.random() * 25 + 5; // 往外擴散 5~30 像素的亮光圈
                                newTargets.push({
                                    x: x + Math.cos(angle) * distance,
                                    y: y + Math.sin(angle) * distance,
                                    isGlow: true
                                });
                            }
                        }
                    }
                }
            }

            if (newTargets.length === 0) {
                particles.forEach(p => {
                    p.targetX = Math.random() * width;
                    p.targetY = Math.random() * height;
                });
                return;
            }

            // 重新洗牌並調配粒子池
            if (particles.length < newTargets.length) {
                const diff = newTargets.length - particles.length;
                for (let i = 0; i < diff; i++) {
                    particles.push(new Particle(width / 2, height / 2));
                }
            } else if (particles.length > newTargets.length) {
                particles.splice(newTargets.length);
            }

            newTargets.forEach((t, idx) => {
                if (particles[idx]) {
                    particles[idx].targetX = t.x;
                    particles[idx].targetY = t.y;
                    particles[idx].isGlow = t.isGlow; // 賦予發光屬性
                    particles[idx].assignColor(); 
                }
            });

            memCanvas.width = 0;
            memCanvas.height = 0;
        }

        function getCurrentTargetText() {
            const totalTextCount = textLines.length;
            if (!includeTime) {
                if (currentLineIndex >= totalTextCount) currentLineIndex = 0;
                return textLines[currentLineIndex];
            }
            if (currentLineIndex < totalTextCount) {
                return textLines[currentLineIndex];
            } else {
                return getFreshDateTimeString(); 
            }
        }

        function triggerFontChange() {
            commitSettings();
            let count = 0;
            const forceUpdate = setInterval(() => {
                loadTextLine(getCurrentTargetText());
                if (count++ > 2) clearInterval(forceUpdate);
            }, 100);
        }

        function startCarousel() {
            clearTimeout(globalTimer);
            loadTextLine(getCurrentTargetText());

            globalTimer = setTimeout(() => {
                const totalTextCount = textLines.length;
                const maxIndex = includeTime ? totalTextCount : (totalTextCount - 1);

                if (isRecording && currentLineIndex === maxIndex) {
                    stopRecording();
                    return;
                }

                currentLineIndex++;
                if (currentLineIndex > maxIndex) currentLineIndex = 0;

                startCarousel();
            }, lineDuration);
        }

        function handleExplode(e) {
            if (e.target.closest('#uiPanel') || e.target.closest('.overlay')) return;

            phase = "exploded";
            particles.forEach(p => p.explode());
            clearTimeout(globalTimer);
            
            globalTimer = setTimeout(() => {
                phase = "turbulent";
                stateTimer = 0; 
                globalTimer = setTimeout(() => {
                    const totalTextCount = textLines.length;
                    const maxIndex = includeTime ? totalTextCount : (totalTextCount - 1);

                    if (isRecording && currentLineIndex === maxIndex) {
                        stopRecording();
                        return;
                    }
                    currentLineIndex++;
                    if (currentLineIndex > maxIndex) currentLineIndex = 0;
                    
                    startCarousel();
                }, Math.max(1500, lineDuration - 2200)); 
            }, 2200);
        }

        let lastTime = performance.now();
        function animate(now) {
            let deltaTime = now - lastTime;
            lastTime = now;

            if (phase === "turbulent") {
                stateTimer += deltaTime;
                if (stateTimer >= 1000) phase = "gather"; 
            }

            // 殘影底色
            ctx.fillStyle = 'rgba(5, 5, 5, 0.28)';
            ctx.fillRect(0, 0, width, height);

            // 🌟 渲染核心優化：開啟 Canvas 物理光暈混合模式與陰影模糊
            ctx.save();
            ctx.globalCompositeOperation = "lighter"; // 讓粒子重疊的地方產生物理曝光亮斑
            
            // 設定極細微的發光環境光暈
            ctx.shadowBlur = phase === "gather" ? 4 : 0;
            ctx.shadowColor = baseColor;

            particles.forEach(p => {
                p.update(deltaTime);
                p.draw();
            });
            ctx.restore();

            requestAnimationFrame(animate);
        }

        // ================= 🎥 錄影模組 =================
        function startAutoRecording() {
            if (isRecording) return;
            commitSettings(); 

            currentLineIndex = 0;
            recordedChunks = [];
            const stream = canvas.captureStream(30);
            
            mediaRecorder = new MediaRecorder(stream, { 
                mimeType: 'video/webm;codecs=vp9',
                videoBitsPerSecond: 8000000 
            });

            mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
            mediaRecorder.onstop = exportVideo;
            
            mediaRecorder.start();
            isRecording = true;
            
            document.getElementById('recordBtn').classList.add('recording');
            document.getElementById('recordBtn').innerText = "錄製製作中";
            
            startCarousel();
        }

        function stopRecording() { 
            if (isRecording) { 
                mediaRecorder.stop(); 
                isRecording = false; 
                document.getElementById('recordBtn').classList.remove('recording');
                document.getElementById('recordBtn').innerText = "🔴 錄製製作";
            } 
        }

        function exportVideo() {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; 
            a.download = `Particle_Banner_${Date.now()}.webm`; 
            a.click(); 
            
            document.getElementById('manualDownloadBtn').onclick = () => { a.click(); };
            document.getElementById('download-overlay').style.display = 'flex';
        }

        function closeModal(id) { 
            document.getElementById(id).style.display = 'none'; 
            if(id === 'download-overlay') startCarousel(); 
        }

        function commitSettings() {
            let rawLines = document.getElementById('textInput').value.split('\n').map(l => l.trim()).filter(l => l !== "");
            textLines = rawLines.length === 0 ? [""] : rawLines;
            
            includeTime = document.getElementById('includeTimeCheck').checked;

            lineDuration = parseInt(document.getElementById('durationInput').value, 10) * 1000;
            currentFont = document.getElementById('fontSelect').value;
            baseColor = document.getElementById('colorPicker').value;
            
            document.getElementById('colorPickerWrapper').style.backgroundColor = baseColor;
        }

        // ================= 🔗 網址傳送模組 =================
        function generateShareLink() {
            commitSettings();

            const urlParams = new URLSearchParams();
            urlParams.set('lines', textLines.join('||')); 
            urlParams.set('time', includeTime ? "1" : "0");
            urlParams.set('duration', lineDuration);
            urlParams.set('font', currentFont);
            urlParams.set('color', baseColor);

            const shareUrl = `${window.location.origin}${window.location.pathname}?${urlParams.toString()}`;

            const displayInput = document.getElementById('shareUrlDisplay');
            displayInput.value = shareUrl;
            document.getElementById('link-overlay').style.display = 'flex';

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(shareUrl).then(() => {
                    alert("網址已成功複製！可以貼上分享給好友。");
                }).catch(() => {});
            }
        }

        // ================= 事件處理監聽 =================
        document.getElementById('applyBtn').addEventListener('click', () => {
            triggerFontChange();
            currentLineIndex = 0;
            startCarousel();
        });

        document.getElementById('fontSelect').addEventListener('change', triggerFontChange);
        document.getElementById('colorPicker').addEventListener('input', triggerFontChange);
        
        document.getElementById('includeTimeCheck').addEventListener('change', () => {
            triggerFontChange();
            currentLineIndex = 0;
            startCarousel();
        });

        document.getElementById('sendBtn').addEventListener('click', generateShareLink);
        document.getElementById('recordBtn').addEventListener('click', startAutoRecording);

        window.addEventListener('click', handleExplode);
        window.addEventListener('touchstart', (e) => {
            if (e.target.closest('#uiPanel') || e.target.closest('.overlay')) return;
            e.preventDefault();
            handleExplode(e);
        }, { passive: false });

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            loadTextLine(getCurrentTargetText());
        });

        // ================= 🔗 讀取參數 =================
        const params = new URLSearchParams(window.location.search);
        if (params.has('lines')) {
            try {
                textLines = params.get('lines').split('||');
                includeTime = params.get('time') === "1";
                lineDuration = parseInt(params.get('duration'), 10);
                currentFont = params.get('font');
                baseColor = params.get('color');
                
                const panel = document.getElementById('uiPanel');
                const tip = document.getElementById('mainTip');
                if (panel) panel.remove();
                if (tip) tip.remove();
                
            } catch (e) {
                console.error("網址參數解析錯誤", e);
            }
        }

        // 初始化編輯欄位
        const textInputEl = document.getElementById('textInput');
        if (textInputEl) {
            textInputEl.value = textLines.join('\n');
            document.getElementById('includeTimeCheck').checked = includeTime;
            document.getElementById('fontSelect').value = currentFont;
            document.getElementById('colorPicker').value = baseColor;
            document.getElementById('colorPickerWrapper').style.backgroundColor = baseColor;
            document.getElementById('durationInput').value = lineDuration / 1000;
        }

        // 啟動
        commitSettings();
        startCarousel();
        requestAnimationFrame(animate);
    </script>
</body>
</html>
