<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>粒子字體特效 - 16:9 終極結構穩定版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        /* 純黑背景，並利用 Flexbox 讓 16:9 畫布在任何設備、任何模式下都絕對垂直水平置中 */
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: "Helvetica Neue", Helvetica, Arial, "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 🎬 16:9 橫向固定黃金比例舞台 (不依賴下方控制面板，完全獨立置中) */
        .canvas-container {
            position: relative;
            width: 100%;
            max-width: 100vw;
            aspect-ratio: 16 / 9; 
            background-color: #040404; 
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 當螢幕太寬（如橫放或電腦）或太高（如直立手機）時的定比極限自適應 */
        @media (min-aspect-ratio: 16/9) {
            .canvas-container {
                height: 100vh;
                width: calc(100vh * 16 / 9);
            }
        }
        @media (max-aspect-ratio: 16/9) {
            .canvas-container {
                width: 100vw;
                height: calc(100vw * 9 / 16);
            }
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        
        /* 📱 UI 控制面板：固定在手機螢幕最底端 */
        .control-panel {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(18, 18, 18, 0.96);
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            border-left: 1px solid rgba(255, 255, 255, 0.08);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 16px env(safe-area-inset-bottom, 12px) 16px;
            border-radius: 16px 16px 0 0;
            color: #fff;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            max-width: 540px;
            box-shadow: 0 -10px 35px rgba(0,0,0,0.9);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            z-index: 10;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            max-height: 260px;
        }
        
        .control-panel.collapsed {
            max-height: 40px;
            padding-top: 8px;
            padding-bottom: 8px;
            gap: 0;
            background: rgba(15, 15, 15, 0.7);
            border-color: rgba(255, 255, 255, 0.05);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding-bottom: 4px;
        }
        .control-panel.collapsed .panel-header {
            padding-bottom: 0;
        }
        .panel-title {
            font-weight: bold;
            color: #8e8e93;
            font-size: 11px;
            letter-spacing: 0.5px;
        }
        .toggle-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .toggle-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .panel-body {
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: opacity 0.2s;
            opacity: 1;
        }
        .control-panel.collapsed .panel-body {
            opacity: 0;
            pointer-events: none;
            height: 0;
            overflow: hidden;
        }
        
        .row {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .row label {
            white-space: nowrap;
            color: #ccc;
            min-width: 55px;
            font-weight: 500;
        }
        
        .textarea-container {
            flex: 1;
            display: flex;
        }
        textarea {
            flex: 1;
            height: 42px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 6px 8px;
            border-radius: 8px;
            font-size: 12px;
            outline: none;
            resize: none;
            line-height: 1.3;
        }

        .settings-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            width: 100%;
        }
        
        .setting-item {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            min-width: 100px;
        }
        
        .setting-item.color-item {
            flex: 0 0 auto;
            min-width: auto;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #fff;
            cursor: pointer;
            user-select: none;
            font-size: 12px;
            white-space: nowrap;
        }
        .checkbox-label input {
            cursor: pointer;
            width: 14px;
            height: 14px;
        }

        select, input[type="number"] {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 4px 6px;
            border-radius: 6px;
            font-size: 12px;
            outline: none;
            height: 28px;
        }
        
        .color-picker-wrapper {
            position: relative;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.6);
            overflow: hidden;
            cursor: pointer;
        }
        input[type="color"] {
            position: absolute;
            top: -5px; left: -5px;
            width: 40px; height: 40px;
            padding: 0; margin: 0;
            border: none;
            cursor: pointer;
            background: none;
        }

        .btn-group {
            display: flex;
            gap: 6px;
        }
        .btn {
            flex: 1;
            height: 32px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .btn-primary { background: #ffffff; color: #000; }
        .btn-primary:hover { background: #e0e0e0; }
        .btn-secondary { background: rgba(255, 255, 255, 0.12); color: #fff; }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.22); }
        
        #recordBtn { background: #ff3b30; color: white; }
        #recordBtn:hover { background: #ff4f44; }
        .recording { animation: pulse 1s infinite; background: #900 !important; }
        @keyframes pulse { 0% {opacity:1} 50% {opacity:0.6} 100% {opacity:1} }

        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal {
            background: #1c1c1e;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            width: 100%;
            max-width: 340px;
            border: 1px solid #3a3a3c;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            color: white;
        }
        .modal h2 { margin: 0 0 8px 0; color: #007AFF; font-size: 16px; }
        .modal h2.success { color: #34c759; }
        .modal p { color: #aaa; font-size: 12px; margin-bottom: 12px; line-height: 1.4; }
        .modal-btn {
            width: 100%; height: 38px; background: #007AFF; color: white;
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 8px;
        }
        .modal-btn.success { background: #34c759; }
        
        #shareUrlDisplay {
            width: 100%;
            padding: 8px;
            background: #2c2c2e;
            border: 1px solid #48484a;
            border-radius: 6px;
            color: #fff;
            font-size: 12px;
            margin-bottom: 5px;
            outline: none;
        }

        .tip {
            position: absolute;
            top: 15px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.2);
            font-size: 11px;
            letter-spacing: 1px;
            pointer-events: none;
            user-select: none;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div class="canvas-container" id="stageContainer">
        <div class="tip" id="mainTip">觸碰畫面粉末飛散</div>
        <canvas id="particleCanvas"></canvas>
    </div>

    <div class="control-panel" id="uiPanel">
        <div class="panel-header">
            <div class="panel-title">CINEMATIC CONTROL PANEL</div>
            <button class="toggle-btn" id="panelToggleBtn" onclick="togglePanel()">收合 ▲</button>
        </div>

        <div class="panel-body" id="uiPanelBody">
            <div class="row">
                <label>文字輸入</label>
                <div class="textarea-container">
                    <textarea id="textInput" placeholder="每行一列文字..."></textarea>
                </div>
            </div>
            
            <div class="settings-grid">
                <div class="setting-item" style="max-width: 80px;">
                    <label style="min-width: auto;">秒數</label>
                    <input type="number" id="durationInput" value="4" min="2" max="20">
                </div>

                <div class="setting-item" style="max-width: 110px;">
                    <label class="checkbox-label">
                        <input type="checkbox" id="includeTimeCheck"> 加上時間
                    </label>
                </div>
                
                <div class="setting-item">
                    <label style="min-width: auto;">字型</label>
                    <select id="fontSelect">
                        <option value='"Helvetica Neue", Helvetica, Arial, "PingFang TC", "Heiti TC", "微軟正黑體", sans-serif'>經典粗黑體 (預設)</option>
                        <option value='"DFKai-SB", "BiauKai", "PMingLiU", "新細明體", serif'>傳統標楷/明體 (細)</option>
                        <option value='"Times New Roman", "Georgia", serif'>英數襯線體 (古典)</option>
                    </select>
                </div>
                
                <div class="setting-item color-item">
                    <label style="min-width: auto;">顏色</label>
                    <div class="color-picker-wrapper" id="colorPickerWrapper">
                        <input type="color" id="colorPicker" value="#ffffff">
                    </div>
                </div>
            </div>
            
            <div class="btn-group">
                <button class="btn btn-secondary" id="applyBtn">更新重播</button>
                <button class="btn" id="recordBtn">🔴 錄製製作</button>
                <button class="btn btn-primary" id="sendBtn">🔗 傳送網址</button>
            </div>
        </div>
    </div>

    <div id="download-overlay" class="overlay">
        <div class="modal">
            <h2 class="success">✨ 錄製完成</h2>
            <p>如果您的瀏覽器沒有自動觸發下載，請點擊下方按鈕手動儲存影片。</p>
            <button id="manualDownloadBtn" class="modal-btn success">下載特效影片</button>
            <button onclick="closeModal('download-overlay')" style="background:none; color:#666; border:none; cursor:pointer; font-size:12px; margin-top:10px;">關閉視窗</button>
        </div>
    </div>

    <div id="link-overlay" class="overlay">
        <div class="modal">
            <h2>🔗 分享網址生成成功</h2>
            <p>網址已支援全平台防亂碼。若沒有自動複製成功，請點擊欄位全選並複製：</p>
            <input type="text" id="shareUrlDisplay" readonly onclick="this.select();">
            <button onclick="closeModal('link-overlay')" class="modal-btn">確定並返回</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const container = document.getElementById('stageContainer');

        let width = canvas.width = container.clientWidth;
        let height = canvas.height = container.clientHeight;

        let textLines = ["微風拂過", "細粉飛散", "凝聚成字"];
        let includeTime = false; 
        
        let currentLineIndex = 0;
        let lineDuration = 4000; 
        let currentFont = '"Helvetica Neue", Helvetica, Arial, "PingFang TC", "Heiti TC", "微軟正黑體", sans-serif';
        let baseColor = "#ffffff";

        let particles = [];
        let stateTimer = 0;      
        let phase = "turbulent"; 
        let globalTimer = null;  

        let mediaRecorder, recordedChunks = [], isRecording = false;

        const particleSpacing = 3; 
        const particleRadius = 1.1; 
        const friction = 0.93;     

        function togglePanel() {
            const panel = document.getElementById('uiPanel');
            const btn = document.getElementById('panelToggleBtn');
            if (panel.classList.contains('collapsed')) {
                panel.classList.remove('collapsed');
                btn.innerText = "收合 ▲";
            } else {
                panel.classList.add('collapsed');
                btn.innerText = "展開 ▼";
            }
        }

        function getFreshDateString() {
            const now = new Date();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const date = String(now.getDate()).padStart(2, '0');
            const weekDays = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
            return `${month}/${date} ${weekDays[now.getDay()]}`; 
        }

        function getFreshTimeString() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            return `${hours}:${minutes}`; 
        }

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 255, g: 255, b: 255 };
        }

        // 智慧多重 URL 解碼器（對抗 Double Encoding）
        function smartDecode(str) {
            let decoded = str;
            let previous = "";
            let safetyVal = 0;
            while (decoded.includes('%') && decoded !== previous && safetyVal < 5) {
                previous = decoded;
                try {
                    decoded = decodeURIComponent(decoded);
                } catch(e) {
                    break; 
                }
                safetyVal++;
            }
            return decoded;
        }

        class Particle {
            constructor(x, y, isFirefly = false) {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.targetX = x;
                this.targetY = y;
                this.vx = (Math.random() - 0.5) * 4;
                this.vy = (Math.random() - 0.5) * 4;
                this.isFirefly = isFirefly; 
                
                this.noiseSeedX = Math.random() * 500;
                this.noiseSeedY = Math.random() * 500;
                this.fireflySpeed = Math.random() * 0.4 + 0.2;
                this.glowPhase = Math.random() * Math.PI * 2;
                
                this.assignColor();
            }

            assignColor() {
                const rgb = hexToRgb(baseColor);
                const colorVary = Math.floor(Math.random() * 40) - 20; 
                const r = Math.max(0, Math.min(255, rgb.r + colorVary));
                const g = Math.max(0, Math.min(255, rgb.g + colorVary));
                const b = Math.max(0, Math.min(255, rgb.b + colorVary));
                
                if (this.isFirefly) {
                    this.baseAlpha = Math.random() * 0.25 + 0.15;
                    this.colorRGBA = { r, g, b };
                    this.color = `rgba(${r}, ${g}, ${b}, ${this.baseAlpha})`;
                    this.radius = particleRadius * (Math.random() * 1.0 + 0.6); 
                } else {
                    this.color = `rgba(${r}, ${g}, ${b}, ${Math.random() * 0.7 + 0.4})`;
                    this.radius = particleRadius;
                }
            }

            update(deltaTime) {
                if (this.isFirefly) {
                    this.glowPhase += 0.02;
                    const currentAlpha = this.baseAlpha + Math.sin(this.glowPhase) * 0.12;
                    this.color = `rgba(${this.colorRGBA.r}, ${this.colorRGBA.g}, ${this.colorRGBA.b}, ${Math.max(0.05, currentAlpha)})`;
                }

                if (phase === "turbulent") {
                    this.noiseSeedX += 0.05;
                    this.noiseSeedY += 0.05;
                    let noiseX = Math.sin(this.noiseSeedX) * 4;
                    let noiseY = Math.cos(this.noiseSeedY) * 4;
                    this.vx += noiseX * 0.25; 
                    this.vy += noiseY * 0.25;
                    this.vx += (this.targetX - this.x) * 0.003; 
                    this.vy += (this.targetY - this.y) * 0.003;
                    this.vx *= 0.88;
                    this.vy *= 0.88;
                } else if (phase === "gather") {
                    let dx = this.targetX - this.x;
                    let dy = this.targetY - this.y;
                    
                    if (this.isFirefly) {
                        this.noiseSeedX += 0.015;
                        this.noiseSeedY += 0.015;
                        let flyX = Math.sin(this.noiseSeedX) * this.fireflySpeed;
                        let flyY = Math.cos(this.noiseSeedY) * this.fireflySpeed;
                        
                        this.vx += dx * 0.015 + flyX;
                        this.vy += dy * 0.015 + flyY;
                        this.vx *= 0.85; 
                        this.vy *= 0.85;
                    } else {
                        this.vx += dx * 0.07;
                        this.vy += dy * 0.07;
                        this.vx *= 0.68;
                        this.vy *= 0.68;
                    }
                } else if (phase === "exploded") {
                    this.vx *= friction;
                    this.vy *= friction;
                }

                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
            }

            explode() {
                const angle = Math.random() * Math.PI * 2;
                const speed = this.isFirefly ? (Math.random() * 24 + 6) : (Math.random() * 18 + 6);
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
            }
        }

        function loadTextLine(rawText) {
            phase = "turbulent";
            stateTimer = 0;

            const text = String(rawText || "").trim();
            if (text === "") {
                particles.forEach(p => { p.targetX = Math.random() * width; p.targetY = Math.random() * height; });
                return;
            }

            // 確保每次重新計算時容器寬高是正常的
            if (width === 0 || height === 0) {
                width = canvas.width = container.clientWidth;
                height = canvas.height = container.clientHeight;
            }

            const memCanvas = document.createElement('canvas');
            const memCtx = memCanvas.getContext('2d');
            memCanvas.width = width || 600;
            memCanvas.height = height || 337;
            memCtx.clearRect(0, 0, memCanvas.width, memCanvas.height);

            const isHeiti = currentFont.includes('PingFang') || currentFont.includes('Heiti') || currentFont.includes('Helvetica');
            const fontWeight = isHeiti ? '900' : 'normal';

            memCtx.font = `${fontWeight} 50px ${currentFont}`;
            let metrics = memCtx.measureText(text);
            let measuredWidth = metrics.width || (memCanvas.width * 0.5);
            
            let fontSizeBasedOnWidth = ((memCanvas.width * 0.78) / measuredWidth) * 50;
            let fontSizeBasedOnHeight = memCanvas.height * 0.48;
            
            let fontSize = Math.min(fontSizeBasedOnWidth, fontSizeBasedOnHeight);
            if (fontSize < 14) fontSize = 14;

            memCtx.font = `${fontWeight} ${fontSize}px ${currentFont}`;
            memCtx.fillStyle = "#ffffff";
            memCtx.textAlign = "center";
            memCtx.textBaseline = "middle";
            memCtx.fillText(text, memCanvas.width / 2, memCanvas.height / 2);

            let imgData;
            try {
                imgData = memCtx.getImageData(0, 0, memCanvas.width, memCanvas.height).data;
            } catch(e) {
                console.error("ImageData 讀取失敗", e);
                return;
            }
            
            let newTargets = [];

            for (let y = 0; y < memCanvas.height; y += particleSpacing) {
                for (let x = 0; x < memCanvas.width; x += particleSpacing) {
                    const idx = (y * memCanvas.width + x) * 4;
                    if (imgData[idx + 3] > 128 && imgData[idx] > 128) {
                        
                        newTargets.push({ x: x, y: y, isFirefly: false });

                        const leftIdx = idx - 4;
                        const rightIdx = idx + 4;
                        const topIdx = idx - (memCanvas.width * 4);
                        const bottomIdx = idx + (memCanvas.width * 4);

                        if (imgData[leftIdx + 3] < 50 || imgData[rightIdx + 3] < 50 || imgData[topIdx + 3] < 50 || imgData[bottomIdx + 3] < 50) {
                            const ffCount = Math.random() > 0.45 ? 2 : 1;
                            for (let g = 0; g < ffCount; g++) {
                                const angle = Math.random() * Math.PI * 2;
                                const dist = Math.random() * 32 + 10;
                                newTargets.push({
                                    x: x + Math.cos(angle) * dist,
                                    y: y + Math.sin(angle) * dist,
                                    isFirefly: true
                                });
                            }
                        }
                    }
                }
            }

            if (newTargets.length === 0) {
                particles.forEach(p => { p.targetX = Math.random() * width; p.targetY = Math.random() * height; });
                return;
            }

            if (particles.length < newTargets.length) {
                const diff = newTargets.length - particles.length;
                for (let i = 0; i < diff; i++) particles.push(new Particle(width / 2, height / 2));
            } else if (particles.length > newTargets.length) {
                particles.splice(newTargets.length);
            }

            newTargets.forEach((t, idx) => {
                if (particles[idx]) {
                    particles[idx].targetX = t.x;
                    particles[idx].targetY = t.y;
                    particles[idx].isFirefly = t.isFirefly; 
                    particles[idx].assignColor(); 
                }
            });

            memCanvas.width = 0;
            memCanvas.height = 0;
        }

        function getCurrentTargetText() {
            const totalTextCount = textLines.length;
            if (!includeTime) {
                if (currentLineIndex >= totalTextCount) currentLineIndex = 0;
                return textLines[currentLineIndex];
            }
            
            if (currentLineIndex < totalTextCount) {
                return textLines[currentLineIndex];
            } else if (currentLineIndex === totalTextCount) {
                return getFreshDateString(); 
            } else {
                return getFreshTimeString(); 
            }
        }

        function triggerFontChange() {
            commitSettings();
            let count = 0;
            const forceUpdate = setInterval(() => {
                loadTextLine(getCurrentTargetText());
                if (count++ > 2) clearInterval(forceUpdate);
            }, 100);
        }

        function startCarousel() {
            clearTimeout(globalTimer);
            loadTextLine(getCurrentTargetText());

            globalTimer = setTimeout(() => {
                const totalTextCount = textLines.length;
                const maxIndex = includeTime ? (totalTextCount + 1) : (totalTextCount - 1);

                if (isRecording && currentLineIndex === maxIndex) {
                    stopRecording();
                    return;
                }

                currentLineIndex++;
                if (currentLineIndex > maxIndex) currentLineIndex = 0;

                startCarousel();
            }, lineDuration);
        }

        function handleExplode(e) {
            if (e.target.closest('#uiPanel') || e.target.closest('.overlay')) return;

            phase = "exploded";
            particles.forEach(p => p.explode());
            clearTimeout(globalTimer);
            
            globalTimer = setTimeout(() => {
                phase = "turbulent";
                stateTimer = 0; 
                globalTimer = setTimeout(() => {
                    const totalTextCount = textLines.length;
                    const maxIndex = includeTime ? (totalTextCount + 1) : (totalTextCount - 1);

                    if (isRecording && currentLineIndex === maxIndex) {
                        stopRecording();
                        return;
                    }
                    currentLineIndex++;
                    if (currentLineIndex > maxIndex) currentLineIndex = 0;
                    
                    startCarousel();
                }, Math.max(1500, lineDuration - 2200)); 
            }, 2200);
        }

        let lastTime = performance.now();
        function animate(now) {
            let deltaTime = now - lastTime;
            lastTime = now;

            if (phase === "turbulent") {
                stateTimer += deltaTime;
                if (stateTimer >= 1000) phase = "gather"; 
            }

            ctx.fillStyle = 'rgba(4, 4, 4, 0.26)';
            ctx.fillRect(0, 0, width, height);

            ctx.save();
            ctx.globalCompositeOperation = "lighter"; 
            
            ctx.shadowBlur = phase === "gather" ? 5 : 0;
            ctx.shadowColor = baseColor;

            particles.forEach(p => {
                p.update(deltaTime);
                p.draw();
            });
            ctx.restore();

            requestAnimationFrame(animate);
        }

        // ================= 🎥 錄影模組 =================
        function startAutoRecording() {
            if (isRecording) return;
            commitSettings(); 

            currentLineIndex = 0;
            recordedChunks = [];
            const stream = canvas.captureStream(30);
            
            mediaRecorder = new MediaRecorder(stream, { 
                mimeType: 'video/webm;codecs=vp9',
                videoBitsPerSecond: 8000000 
            });

            mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
            mediaRecorder.onstop = exportVideo;
            
            mediaRecorder.start();
            isRecording = true;
            
            document.getElementById('recordBtn').classList.add('recording');
            document.getElementById('recordBtn').innerText = "錄製製作中";
            
            startCarousel();
        }

        function stopRecording() { 
            if (isRecording) { 
                mediaRecorder.stop(); 
                isRecording = false; 
                document.getElementById('recordBtn').classList.remove('recording');
                document.getElementById('recordBtn').innerText = "🔴 錄製製作";
            } 
        }

        function exportVideo() {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; 
            a.download = `Particle_Cinema_16x9_${Date.now()}.webm`; 
            a.click(); 
            
            document.getElementById('manualDownloadBtn').onclick = () => { a.click(); };
            document.getElementById('download-overlay').style.display = 'flex';
        }

        function closeModal(id) { 
            document.getElementById(id).style.display = 'none'; 
            if(id === 'download-overlay') startCarousel(); 
        }

        function commitSettings() {
            const txtEl = document.getElementById('textInput');
            if(!txtEl) return; // 欣賞模式下沒有欄位直接跳過

            let rawLines = txtEl.value.split('\n').map(l => l.trim()).filter(l => l !== "");
            textLines = rawLines.length === 0 ? [""] : rawLines;
            
            includeTime = document.getElementById('includeTimeCheck').checked;
            lineDuration = parseInt(document.getElementById('durationInput').value, 10) * 1000;
            currentFont = document.getElementById('fontSelect').value;
            baseColor = document.getElementById('colorPicker').value;
            
            document.getElementById('colorPickerWrapper').style.backgroundColor = baseColor;
        }

        function generateShareLink() {
            commitSettings();

            const urlParams = new URLSearchParams();
            urlParams.set('lines', textLines.map(encodeURIComponent).join('||')); 
            urlParams.set('time', includeTime ? "1" : "0");
            urlParams.set('duration', lineDuration);
            urlParams.set('font', currentFont);
            urlParams.set('color', baseColor);

            const shareUrl = `${window.location.origin}${window.location.pathname}?${urlParams.toString()}`;

            const displayInput = document.getElementById('shareUrlDisplay');
            displayInput.value = shareUrl;
            document.getElementById('link-overlay').style.display = 'flex';

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(shareUrl).then(() => {
                    alert("網址已成功複製！可以貼上分享給好友。");
                }).catch(() => {});
            }
        }

        // ================= 🔗 智慧解碼與顯示模式切換 =================
        const params = new URLSearchParams(window.location.search);
        if (params.has('lines')) {
            try {
                let rawParamLines = params.get('lines').split('||');
                textLines = rawParamLines.map(line => smartDecode(line));

                includeTime = params.get('time') === "1";
                lineDuration = parseInt(params.get('duration'), 10);
                
                if (params.has('font')) currentFont = smartDecode(params.get('font'));
                if (params.has('color')) baseColor = smartDecode(params.get('color'));
                
                // 🌟 核心修正：欣賞模式下使用 display: none 隱藏，不破壞 HTML 高度骨架
                const panel = document.getElementById('uiPanel');
                const tip = document.getElementById('mainTip');
                if (panel) panel.style.display = 'none';
                if (tip) tip.style.display = 'none';
                
            } catch (e) {
                console.error("網址參數解析錯誤", e);
            }
        }

        // 初始化編輯欄位（僅在非欣賞模式下執行）
        const textInputEl = document.getElementById('textInput');
        if (textInputEl) {
            textInputEl.value = textLines.join('\n');
            document.getElementById('includeTimeCheck').checked = includeTime;
            document.getElementById('fontSelect').value = currentFont;
            document.getElementById('colorPicker').value = baseColor;
            document.getElementById('colorPickerWrapper').style.backgroundColor = baseColor;
            document.getElementById('durationInput').value = lineDuration / 1000;
            
            // 綁定事件
            document.getElementById('applyBtn').addEventListener('click', () => {
                triggerFontChange();
                currentLineIndex = 0;
                startCarousel();
            });
            document.getElementById('fontSelect').addEventListener('change', triggerFontChange);
            document.getElementById('colorPicker').addEventListener('input', triggerFontChange);
            document.getElementById('includeTimeCheck').addEventListener('change', () => {
                triggerFontChange();
                currentLineIndex = 0;
                startCarousel();
            });
            document.getElementById('sendBtn').addEventListener('click', generateShareLink);
            document.getElementById('recordBtn').addEventListener('click', startAutoRecording);
        }

        // 視窗自適應
        window.addEventListener('resize', () => {
            width = canvas.width = container.clientWidth;
            height = canvas.height = container.clientHeight;
            loadTextLine(getCurrentTargetText());
        });

        // 觸控點擊爆炸
        window.addEventListener('click', handleExplode);
        window.addEventListener('touchstart', (e) => {
            if (e.target.closest('#uiPanel') || e.target.closest('.overlay')) return;
            e.preventDefault();
            handleExplode(e);
        }, { passive: false });

        // 啟動與初始化寬高
        width = canvas.width = container.clientWidth;
        height = canvas.height = container.clientHeight;
        commitSettings();
        startCarousel();
        requestAnimationFrame(animate);
    </script>
</body>
</html>
